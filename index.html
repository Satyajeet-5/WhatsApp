<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Toggle Mic</title>
  <style>
    body {
      font-family: Arial;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f5f5f5;
    }

    input {
      padding: 10px;
      font-size: 16px;
      width: 250px;
    }

    button {
      padding: 10px 15px;
      font-size: 18px;
      margin-left: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<input type="text" id="inputBox" placeholder="Speak..." />
<button id="micBtn">🎤</button>

<script>
  let isListening = false;

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  const recognition = new SpeechRecognition();

  recognition.continuous = true;
  recognition.interimResults = true;

  // Convert speech to text
  recognition.onresult = (event) => {
    let text = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      text += event.results[i][0].transcript;
    }
    document.getElementById("inputBox").value = text;
  };

  // Button click toggle
  document.getElementById("micBtn").onclick = () => {
    if (!isListening) {
      recognition.start();
      isListening = true;
      document.getElementById("micBtn").innerText = "⏹️"; // change icon
    } else {
      recognition.stop();
      isListening = false;
      document.getElementById("micBtn").innerText = "🎤";
    }
  };
</script>

</body>
</html>
