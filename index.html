<!DOCTYPE html>
<html>
<body>

<input type="text" id="output" placeholder="Speak..." style="width:300px; padding:10px;">
<button id="btn">🎤</button>

<script>
let isRecording = false;

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const recognition = new SpeechRecognition();

recognition.continuous = true;
recognition.interimResults = false; // only final text

let finalText = "";

// Collect speech
recognition.onresult = (event) => {
    for (let i = event.resultIndex; i < event.results.length; i++) {
        if (event.results[i].isFinal) {
            finalText += event.results[i][0].transcript + " ";
        }
    }
};

// When recording fully stops → show text
recognition.onend = () => {
    document.getElementById("output").value = finalText.trim();
    document.getElementById("btn").innerText = "🎤";
    isRecording = false;
};

// Button toggle
document.getElementById("btn").onclick = () => {
    if (!isRecording) {
        finalText = ""; // reset
        recognition.start();
        isRecording = true;
        document.getElementById("btn").innerText = "⏹️";
    } else {
        recognition.stop(); // triggers onend
    }
};
</script>

</body>
</html>
