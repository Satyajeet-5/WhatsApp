<!DOCTYPE html>
<html>
<body>

<input type="text" id="output" style="width:300px; padding:10px;">
<button id="recordBtn">🎤</button>

<script>
let mediaRecorder;
let audioChunks = [];

document.getElementById("recordBtn").onclick = async () => {
    if (!mediaRecorder || mediaRecorder.state === "inactive") {
        // Start recording
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);

        audioChunks = [];

        mediaRecorder.ondataavailable = (event) => {
            audioChunks.push(event.data);
        };

        mediaRecorder.onstop = async () => {
            const audioBlob = new Blob(audioChunks, { type: "audio/wav" });

            // For now, just show message
            document.getElementById("output").value = "Audio recorded. Send to backend for text.";

            // 👉 Here you send audioBlob to backend (Whisper)
        };

        mediaRecorder.start();
        document.getElementById("recordBtn").innerText = "⏹️";

    } else {
        // Stop recording
        mediaRecorder.stop();
        document.getElementById("recordBtn").innerText = "🎤";
    }
};
</script>

</body>
</html>
