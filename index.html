<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Final Voice Input</title>
</head>
<body>

<input type="text" id="inputBox" placeholder="Speak..." style="width:300px; padding:10px;">
<button id="micBtn">🎤</button>

<script>
let isListening = false;
let finalTranscript = '';

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const recognition = new SpeechRecognition();

recognition.continuous = true;
recognition.interimResults = false; // ❗ Only final results

// Collect final speech internally
recognition.onresult = (event) => {
    for (let i = event.resultIndex; i < event.results.length; i++) {
        if (event.results[i].isFinal) {
            finalTranscript += event.results[i][0].transcript + ' ';
        }
    }
};

// Toggle button
document.getElementById("micBtn").onclick = () => {
    if (!isListening) {
        finalTranscript = ''; // reset
        recognition.start();
        isListening = true;
        document.getElementById("micBtn").innerText = "⏹️";
    } else {
        recognition.stop();
        isListening = false;
        document.getElementById("micBtn").innerText = "🎤";

        // Show text ONLY after stopping
        document.getElementById("inputBox").value = finalTranscript.trim();
    }
};
</script>

</body>
</html>
