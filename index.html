<!DOCTYPE html>
<html>
<body>

<input type="text" id="inputBox" style="width:300px; padding:10px;">
<button id="micBtn">🎤</button>

<script>
let isListening = false;
let finalTranscript = '';

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const recognition = new SpeechRecognition();

recognition.continuous = true;
recognition.interimResults = false;

// Collect all chunks
recognition.onresult = (event) => {
    for (let i = event.resultIndex; i < event.results.length; i++) {
        if (event.results[i].isFinal) {
            finalTranscript += event.results[i][0].transcript + ' ';
        }
    }
};

// ✅ Show result ONLY when recognition fully ends
recognition.onend = () => {
    document.getElementById("inputBox").value = finalTranscript.trim();
    isListening = false;
    document.getElementById("micBtn").innerText = "🎤";
};

document.getElementById("micBtn").onclick = () => {
    if (!isListening) {
        finalTranscript = '';
        recognition.start();
        isListening = true;
        document.getElementById("micBtn").innerText = "⏹️";
    } else {
        recognition.stop(); // wait for onend
    }
};
</script>

</body>
</html>
